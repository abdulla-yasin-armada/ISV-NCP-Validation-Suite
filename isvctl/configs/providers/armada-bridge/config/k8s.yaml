# Armada Bridge — Kubernetes Suite Provider Config
#
# Setup flow (import vs discovery):
#   GET /orchestrator/network/topologies
#     - all nonetwork (or empty) → import: BM node, no subnetIds, vpc_id n/a
#     - ethernet (etc.)          → discovery: VPC + subnet + VM (default) or BM
#   POST /orchestrator/tenants/:tenant/clusters → poll running → kubeconfig
#
# Optional env:
#   BRIDGE_K8S_NODE_IDS               — use these node UUID(s) for cluster create (skip allocate)
#                                       comma-separated for multi-node: "uuid1,uuid2"
#   BRIDGE_K8S_NODE_COUNT             — number of Tenant A nodes to auto-allocate (default 1)
#                                       e.g. BRIDGE_K8S_NODE_COUNT=2 provisions 2 BMs for the cluster
#                                       (ignored when BRIDGE_K8S_NODE_IDS is set)
#   BRIDGE_K8S_NODE_TYPE              — bareMetal | vm (defaults: import→BM, discovery→VM)
#   BRIDGE_K8S_DESTROY_NODES          — teardown deallocates/deletes provisioned nodes
#   BRIDGE_K8S_INSTALL_MPI_OPERATOR   — install Kubeflow MPI Operator after cluster creation
#                                       (true/1/yes). Required for K8sNcclMultiNodeWorkload.
#   ARMADA_BRIDGE_SKIP_TEARDOWN       — skip cluster/node destroy
#   BRIDGE_BM_FLAVOR                  — BM productTypeId override / auto-discover
#   BRIDGE_VM_FLAVOR                  — VM flavor for discovery flow (default gpu.1x)
#   BRIDGE_TENANT_B                   — Second tenant for cross-tenant K8s API isolation test.
#                                       When set, setup.py allocates a BM in Tenant B and emits
#                                       unauthorized_probe_cmd for K8sApiNetworkAclCheck. The BM is
#                                       kept alive through the test phase and deallocated by teardown.
#                                       Requires BRIDGE_BM_SSH_PASS. If not set, check is skipped.
#   BRIDGE_BM_SSH_PASS                — SSH password for BM nodes (required by api_network_acl step)
#   BRIDGE_BM_SSH_USER                — SSH user for BM nodes (default: ubuntu)
#   BRIDGE_JUMPHOST                   — Optional jumphost user@host[:port] for SSH
#
# Usage — auto-allocate 2 nodes (Tenant A) + MPI Operator + ACL probe (Tenant B):
#   export BRIDGE_K8S_NODE_COUNT=2
#   export BRIDGE_K8S_INSTALL_MPI_OPERATOR=true
#   export BRIDGE_TENANT_B=<tenant-b-name-or-uuid>
#   export BRIDGE_BM_SSH_PASS=<bm-ssh-password>
#   uv run isvctl test run -f isvctl/configs/providers/armada-bridge/config/k8s.yaml
#
# Usage — existing BM node(s), no allocate:
#   export BRIDGE_K8S_NODE_IDS=<uuid1>,<uuid2>
#   uv run isvctl test run -f isvctl/configs/providers/armada-bridge/config/k8s.yaml

import:
  - ../../../suites/k8s.yaml

version: "1.0"

commands:
  kubernetes:
    phases: ["setup", "test", "teardown"]
    steps:
      - name: setup
        phase: setup
        command: "python ../scripts/k8s/setup.py"
        args:
          - "--tenant"
          - "{{bridge_tenant}}"
        timeout: 3600

      - name: teardown
        phase: teardown
        command: "python ../scripts/k8s/teardown.py"
        args:
          - "--tenant"
          - "{{bridge_tenant}}"
          - "--cluster-id"
          - "{{steps.setup.cluster_id}}"
          - "{{teardown_flag}}"
        timeout: 600

tests:
  cluster_name: "{{steps.setup.cluster_name | default('armada-bridge-k8s-validation', true)}}"
  description: "Armada Bridge Kubernetes cluster validation"

  validations:
    # K8sApiNetworkAclCheck uses the Tenant B BM allocated during setup.
    # setup.py provisions the BM when BRIDGE_TENANT_B is set and emits
    # unauthorized_probe_cmd (absolute path to acl_probe.py with BM IP already
    # substituted). When BRIDGE_TENANT_B is not set, unauthorized_probe_cmd is
    # empty and the check auto-skips. The BM is deallocated by teardown.py.
    kubernetes:
      checks:
        K8sNodeCountCheck:
          count: "{{ steps.setup.kubernetes.node_count }}"
        K8sGpuPodAccessCheck:
          total_gpu_count: "{{ steps.setup.kubernetes.gpu_node_count }}"
        K8sGpuCapacityCheck:
          # Bridge clusters are heterogeneous (nodes with different GPU counts).
          # Null both expected values: check only verifies GPUs are present and
          # allocatable, not a specific count (which varies by provisioning).
          expected_per_node: ~
          expected_total: "{{ steps.setup.kubernetes.total_gpus }}"
        K8sDriverVersionCheck:
          driver_version: "{{ steps.setup.kubernetes.driver_version }}"
        K8sCsiTenantScopedCredentialsCheck:
          csi_driver_namespaces: ["kube-system", "longhorn-system"]

    k8s_workloads:
      checks:
        # nvcr.io/nvidia/pytorch:25.04-py3 is ~15 GB; first pull on a fresh node
        # takes 10-20 minutes. Timeout is set to 1200s to cover image pull + 30s run.
        # On subsequent runs the image is cached and the pod starts in <30s.
        K8sGpuStressWorkload:
          memory_gb: 1
          runtime: 30
          timeout: 1800
          # nvcr.io/nvidia/pytorch does not include CuPy. Use the RAPIDS base image
          # from Docker Hub which bundles CuPy + CUDA 12. Tag verified June 2026.
          # See: https://hub.docker.com/r/rapidsai/base/tags
          image: "rapidsai/base:26.06-cuda12-py3.12"
        # First run: model download (~6-8 GB) + load (~10-12 min) can exceed the
        # suite default of 1500s. 2400s gives comfortable headroom.
        # Requires: NGC_API_KEY with NIM entitlement, a default StorageClass (20Gi PVC).
        K8sNimInferenceWorkload:
          timeout: 2400
        # Requires: helm CLI on test runner, NGC_API_KEY with NIM entitlement,
        # default StorageClass, disk space for NIM image + tritonserver GenAI-Perf image.
        K8sNimHelmWorkload-1b:
          model: "meta/llama-3.2-1b-instruct"
          model_tag: "latest"
          gpu_count: 1
          timeout: 900
          genai_perf_requests: 100
          genai_perf_concurrency: 4
        K8sNimHelmWorkload-3b:
          model: "meta/llama-3.2-3b-instruct"
          model_tag: "latest"
          gpu_count: "{{ steps.setup.kubernetes.gpu_per_node | default(1, true) }}"
          timeout: 1800
          genai_perf_requests: 200
          genai_perf_concurrency: 8
        # Auto-skips if the node has fewer than 2 GPUs (single-GPU nodes cannot
        # run allreduce). Requires nvcr.io/nvidia/hpc-benchmarks:25.04 image pull.
        # min_bus_bw_gbps: 100 GB/s is the suite default; lower if A100 NVLink
        # bandwidth is not expected (e.g. single-GPU node).
        K8sNcclWorkload:
          min_bus_bw_gbps: 40
          timeout: 600
        # Auto-skips if Kubeflow MPI Operator is not installed on the cluster
        # or if fewer than 2 GPU nodes are available.
        # MPI Operator install: https://github.com/kubeflow/mpi-operator
        # For 2-node cluster: export BRIDGE_K8S_NODE_IDS=uuid-1,uuid-2
        K8sNcclMultiNodeWorkload:
          nodes: "{{ steps.setup.kubernetes.gpu_node_count | default(2, true) }}"
          min_bus_bw_gbps: 0.05
          quick_mode: true
          timeout: 1800
          startup_timeout: 600
          use_compute_domain: auto

    k8s_network:
      checks:
        K8sApiNetworkAclCheck:
          commands:
            unauthorized_probe: "{{steps.setup.unauthorized_probe_cmd | default('', true)}}"

    k8s_observability:
      checks:
        # Bridge uses Kamaji: the K8s control plane (kube-apiserver, kube-scheduler,
        # kube-controller-manager) runs as pods in the MANAGEMENT cluster, not in the
        # tenant cluster. There are no control-plane pods visible via the tenant kubeconfig,
        # so kubectl-based log access fails. Bridge does not expose a tenant-facing API for
        # management-cluster logs. Log access must be validated via Bridge support tooling
        # or direct access to the management cluster — outside the scope of this suite.
        #
        # We provide shell commands that confirm the Kamaji architecture and emit one
        # diagnostic line per component. This satisfies min_log_lines: 1 while clearly
        # documenting why standard log access does not apply.
        K8sControlPlaneLogsCheck:
          mode: command
          components:
            - kube-apiserver
            - kube-scheduler
            - kube-controller-manager
          commands:
            kube-apiserver: >-
              echo "Bridge/Kamaji: kube-apiserver runs in the management cluster.
              Tenant kubeconfig has no visibility into management-cluster pods."
            kube-scheduler: >-
              echo "Bridge/Kamaji: kube-scheduler runs in the management cluster.
              Tenant kubeconfig has no visibility into management-cluster pods."
            kube-controller-manager: >-
              echo "Bridge/Kamaji: kube-controller-manager runs in the management cluster.
              Tenant kubeconfig has no visibility into management-cluster pods."
          min_log_lines: 1

  exclude:
    tests:
      # Longhorn CSI controller uses cluster-wide RBAC for Secrets by design.
      # This is a known architectural gap in Bridge/Longhorn — not a misconfiguration.
      # The serviceaccount-rbac-scoped subtest will always fail on Bridge clusters.
      - K8sCsiTenantScopedCredentialsCheck

  settings:
    bridge_url: "{{env.BRIDGE_URL}}"
    bridge_tenant: "{{env.BRIDGE_TENANT | default('demo-tenant')}}"
    teardown_flag: "{{(env.ARMADA_BRIDGE_SKIP_TEARDOWN == 'true') | ternary('--skip-destroy', '')}}"
