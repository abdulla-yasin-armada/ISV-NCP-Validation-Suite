# Armada Bridge — VM Suite Provider Config
#
# ── Network flow (launch_instance topology branch) ───────────────────────────
# Discovery flow (any topology networkType != nonetwork, e.g. ethernet):
#   Creates VPC + subnet, passes subnetIds on VM allocate, emits real vpc_id.
#
# Import flow (topologies empty OR all networkType nonetwork — typical CSV lab):
#   Allocates VM without subnetIds. vpc_id / security_group_id are wiring
#   placeholders (default "n/a") so InstanceListCheck passes without Bridge VPC.
#
# No exclude.markers: [ssh]. The demo-armada-bridge Makefile target excludes
# this suite entirely (vm/bare_metal need real SSH for ConnectivityCheck etc.).
# Run this suite only with live Bridge infra.
#
# Blocked steps (❌ in bridge-isv-ncp-status.md):
#   verify_tags, serial_console, console_rbac → best_effort: true
#
# Usage (demo):
#   ISVCTL_DEMO_MODE=1 uv run isvctl test run -f isvctl/configs/providers/armada-bridge/config/vm.yaml
#
# Usage (live):
#   BRIDGE_URL, BRIDGE_USERNAME, BRIDGE_PASSWORD, BRIDGE_TENANT, BRIDGE_INSECURE=1
#   Optional: BRIDGE_VM_COUNT, BRIDGE_VM_FLAVOR_TEMPLATE_ID, BRIDGE_VM_FLAVOR (UUID or name hint),
#   BRIDGE_VM_GPU_TYPE (auto-discover filter), BRIDGE_VM_OS, BRIDGE_VPC_ID, BRIDGE_SG_ID

import:
  - ../../../suites/vm.yaml

version: "1.0"

commands:
  vm:
    phases: ["setup", "test", "teardown"]
    steps:
      - name: launch_instance
        phase: setup
        command: "python ../scripts/vm/launch_instance.py"
        args:
          - "--name"
          - "isv-test-gpu"
        timeout: 1500

      - name: list_instances
        phase: test
        command: "python ../scripts/vm/list_instances.py"
        args:
          - "--tenant"
          - "{{bridge_tenant}}"
          - "--vpc-id"
          - "{{steps.launch_instance.vpc_id}}"
          - "--instance-id"
          - "{{steps.launch_instance.instance_id}}"
        timeout: 60

      - name: verify_tags
        phase: test
        command: "python ../scripts/vm/describe_tags.py"
        args:
          - "--tenant"
          - "{{bridge_tenant}}"
          - "--vm-id"
          - "{{steps.launch_instance.instance_id}}"
        timeout: 60
        best_effort: true

      - name: stop_instance
        phase: test
        command: "python ../scripts/vm/stop_instance.py"
        args:
          - "--tenant"
          - "{{bridge_tenant}}"
          - "--vm-id"
          - "{{steps.launch_instance.instance_id}}"
          - "--public-ip"
          - "{{steps.launch_instance.public_ip}}"
        timeout: 120

      - name: start_instance
        phase: test
        command: "python ../scripts/vm/start_instance.py"
        args:
          - "--tenant"
          - "{{bridge_tenant}}"
          - "--vm-id"
          - "{{steps.launch_instance.instance_id}}"
          - "--key-file"
          - "{{steps.launch_instance.key_file}}"
        timeout: 300

      - name: reboot_instance
        phase: test
        command: "python ../scripts/vm/reboot_instance.py"
        args:
          - "--tenant"
          - "{{bridge_tenant}}"
          - "--vm-id"
          - "{{steps.launch_instance.instance_id}}"
          - "--key-file"
          - "{{steps.launch_instance.key_file}}"
          - "--public-ip"
          - "{{steps.start_instance.public_ip}}"
        timeout: 300

      - name: serial_console
        phase: test
        command: "python ../scripts/vm/serial_console.py"
        args:
          - "--tenant"
          - "{{bridge_tenant}}"
          - "--vm-id"
          - "{{steps.launch_instance.instance_id}}"
        timeout: 60
        best_effort: true

      - name: console_rbac
        phase: test
        command: "python ../scripts/vm/console_rbac.py"
        args:
          - "--tenant"
          - "{{bridge_tenant}}"
          - "--vm-id"
          - "{{steps.launch_instance.instance_id}}"
        timeout: 60
        best_effort: true

      - name: describe_instance
        phase: test
        command: "python ../scripts/vm/describe_instance.py"
        args:
          - "--tenant"
          - "{{bridge_tenant}}"
          - "--vm-id"
          - "{{steps.launch_instance.instance_id}}"
          - "--key-file"
          - "{{steps.launch_instance.key_file}}"
        timeout: 300

      - name: deploy_nim
        phase: test
        command: "python ../../shared/deploy_nim.py"
        args:
          - "--host"
          - "{{steps.describe_instance.public_ip}}"
          - "--key-file"
          - "{{steps.describe_instance.key_file}}"
        timeout: 600
        best_effort: true  # NIM deployment is optional; don't block VM lifecycle validation

      - name: teardown_nim
        phase: teardown
        command: "python ../../shared/teardown_nim.py"
        args:
          - "--host"
          - "{{steps.describe_instance.public_ip}}"
          - "--key-file"
          - "{{steps.describe_instance.key_file}}"
        timeout: 120
        best_effort: true  # describe_instance may not have run; keep teardown unblocked

      - name: teardown
        phase: teardown
        command: "python ../scripts/vm/teardown.py"
        args:
          - "--tenant"
          - "{{bridge_tenant}}"
          - "--vm-ids"
          - "{{steps.launch_instance.instance_ids | join(',')}}"
          - "{{teardown_flag}}"
        timeout: 300

tests:
  cluster_name: "armada-bridge-vm-validation"
  description: "Armada Bridge VM lifecycle validation"

  exclude:
    tests:
      - CloudInitCheck         # Bridge KVM VMs have no AWS-style metadata service (169.254.169.254)
      - DriverCheck            # CUDA toolkit (nvcc) not installed on Bridge KVM VM image
      - ContainerRuntimeCheck  # Docker not installed on Bridge KVM VM image
      - InstanceTagCheck       # Bridge has no VM tagging API (GET /vms/<id>/tags not exposed)
      - SerialConsoleCheck     # Serial console not available on Bridge KVM VMs
      - ConsoleRbacCheck       # Console RBAC not available on Bridge KVM VMs

  settings:
    bridge_url: "{{env.BRIDGE_URL | default('')}}"
    bridge_tenant: "{{env.BRIDGE_TENANT | default('demo-tenant')}}"
    bridge_flavor: "{{env.BRIDGE_VM_FLAVOR | default('')}}"
    bridge_flavor_template_id: "{{env.BRIDGE_VM_FLAVOR_TEMPLATE_ID | default('')}}"
    bridge_vm_count: "{{env.BRIDGE_VM_COUNT | default('1')}}"
    bridge_vpc_id: "{{env.BRIDGE_VPC_ID | default('n/a')}}"
    bridge_security_group_id: "{{env.BRIDGE_SG_ID | default('n/a')}}"
    teardown_flag: "{{(env.ARMADA_BRIDGE_SKIP_TEARDOWN == 'true') | ternary('--skip-destroy', '')}}"
